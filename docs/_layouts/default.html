<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}Travis Heurtelou, GTM engineer</title>
<style>
  body { font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1f2328; max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 36px 0 10px; border-bottom: 1px solid #d0d7de; padding-bottom: 4px; }
  a { color: #0b6bcb; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { border: 1px solid #d0d7de; padding: 6px 10px; text-align: left; vertical-align: top; }
  code { background: #f6f8fa; padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  pre { background: #f6f8fa; padding: 12px; overflow-x: auto; }
  .contact { background: #f6f8fa; padding: 10px 14px; border-radius: 8px; }
  footer { margin-top: 48px; border-top: 1px solid #d0d7de; padding-top: 12px; font-size: 15px; }
</style>
</head>
<body>
{{ content }}
<footer>Travis Heurtelou · <a href="mailto:HeurtelouTravis@gmail.com">HeurtelouTravis@gmail.com</a> · <a href="https://www.linkedin.com/in/travis-heurtelou/">LinkedIn</a> · <a href="https://github.com/Trav54219">GitHub</a></footer>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("pre code.language-mermaid").forEach((el) => {
    const div = document.createElement("div"); div.className = "mermaid"; div.textContent = el.textContent;
    el.parentElement.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  await mermaid.run();
</script>
</body>
</html>
